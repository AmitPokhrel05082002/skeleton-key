services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: skeletonkey
      POSTGRES_USER: skeletonkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skeletonkey}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skeletonkey -d skeletonkey"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: skeleton/backend
      additional_contexts:
        schema: ./schema
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skeletonkey
      SPRING_DATASOURCE_USERNAME: skeletonkey
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-skeletonkey}
      SKELETONKEY_JWT_SECRET: ${SKELETONKEY_JWT_SECRET:?set SKELETONKEY_JWT_SECRET (>= 32 chars)}
      SKELETONKEY_DEFINITIONS_DIR: /data/definitions
      SKELETONKEY_SEED_FILE: ${SKELETONKEY_SEED_FILE:-}
    volumes:
      - ./examples:/data/definitions:ro

volumes:
  pgdata:
