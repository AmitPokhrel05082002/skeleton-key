spring.application.name=skeleton-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.enabled=true

skeletonkey.jwt.secret=${SKELETONKEY_JWT_SECRET:}
skeletonkey.jwt.expiry-seconds=3600
skeletonkey.definitions.dir=${SKELETONKEY_DEFINITIONS_DIR:}
skeletonkey.definitions.auto-publish=true
skeletonkey.seed.file=${SKELETONKEY_SEED_FILE:}
skeletonkey.page.max-size=100
skeletonkey.admin-role=PLATFORM_ADMIN
