# Installed as /etc/nginx/conf.d/default.conf, so it is included in the http context.
# Pass the client's X-Request-Id through, or use nginx's generated $request_id.
map $http_x_request_id $sk_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # add_header is not inherited into a location that defines its own add_header,
    # so every location includes the security headers itself.

    location ^~ /api/ {
        include security-headers.conf;
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $sk_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Request-Id $sk_request_id always;
    }

    location = /index.html {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /assets/config.json {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output only: <name>-<8 char hash>.js|css in the root, and media/ files.
    location ~ "^/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        include security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (unhashed assets such as assets/themes/*.css, routes): revalidate, SPA fallback.
    location / {
        include security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
